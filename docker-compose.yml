services:
  hop-rank:
    image: ghcr.io/kostecki/hop-rank:latest
    restart: unless-stopped
    container_name: hop-rank
    hostname: hop-rank
    ports:
      - "${APP_PORT:-3000}:3000"
      - "${WS_PORT:-4000}:4000"
    environment:
      APP_URL: ${APP_URL}
      TZ: ${TZ:-Europe/Copenhagen}
      MAX_SESSION_AGE_HOURS: ${MAX_SESSION_AGE_HOURS}
      MAX_SESSION_IDLE_TIME_HOURS: ${MAX_SESSION_IDLE_TIME_HOURS}
      SESSION_SECRET: ${SESSION_SECRET}
      TOTP_SECRET: ${TOTP_SECRET}
      DATABASE_PATH: ${DATABASE_PATH}
      DATABASE_FILE_NAME: ${DATABASE_FILE_NAME}
      ADMIN_USER_EMAILS: ${ADMIN_USER_EMAILS}
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT}
      SMTP_USER: ${SMTP_USER}
      SMTP_PASS: ${SMTP_PASS}
      SMTP_FROM: ${SMTP_FROM}
      UNTAPPD_CLIENT_ID: ${UNTAPPD_CLIENT_ID}
      UNTAPPD_CLIENT_SECRET: ${UNTAPPD_CLIENT_SECRET}
      UNTAPPD_REDIRECT_URL: ${UNTAPPD_REDIRECT_URL}
    volumes:
      - ${DATA_DIR:-.}/app/data/database:/hop-rank/app/database
    labels:
      - "nautical-backup.group=hop-rank"

  drizzle-gateway:
    image: ghcr.io/drizzle-team/gateway:1.7.0
    container_name: hop-rank-drizzle-gateway
    hostname: hop-rank-drizzle-gateway
    restart: unless-stopped
    ports:
      - "${DRIZZLE_PORT:-4983}:4983"
    environment:
      PORT: 4983
      MASTERPASS: ${DRIZZLE_GATEWAY_MASTERPASS}
    volumes:
      - ${DATA_DIR:-.}/drizzle-gateway:/app
      - ${DATA_DIR:-.}/app/data/database:/hop-rank/app/database
    labels:
      - "nautical-backup.group=hop-rank"
      - "nautical-backup.override-source-dir=hop-rank"
